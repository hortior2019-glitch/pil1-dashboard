<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repositorio de Documentos — Gestión Documental</title>
<style>
  :root{
    --verde-oscuro:#173628;
    --verde-oscuro-2:#1f4433;
    --dorado:#c9a227;
    --dorado-claro:#e4c765;
    --verde-claro-bg:#eef5f0;
    --gris-texto:#3a3a3a;
    --gris-suave:#6b6b6b;
    --borde:#d8e3da;
    --blanco:#ffffff;
    --verde-activo:#1f6b45;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Segoe UI', Arial, sans-serif;
    background:var(--verde-claro-bg);
    color:var(--gris-texto);
  }

  /* ===== HEADER ===== */
  header.top{
    background:linear-gradient(135deg, var(--verde-oscuro) 0%, var(--verde-oscuro-2) 100%);
    color:#fff;
    padding:22px 32px 18px 32px;
    border-bottom:3px solid var(--dorado);
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:16px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:18px;
  }
  .brand-text .kicker{
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--dorado-claro);
    margin-bottom:4px;
  }
  .brand-text h1{
    font-family:Georgia,'Times New Roman',serif;
    font-weight:700;
    font-size:30px;
    line-height:1.1;
  }
  .brand-text .subtitle{
    font-size:13px;
    color:#cfe0d5;
    margin-top:4px;
  }
  /* ===== FILTER BAR ===== */
  .filterbar{
    background:#fff;
    border-bottom:1px solid var(--borde);
    padding:12px 24px;
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .filterbar label.small{
    font-size:12px;
    color:var(--gris-suave);
    text-transform:uppercase;
    letter-spacing:1px;
    margin-right:4px;
  }
  .pill-btn{
    border:1px solid var(--borde);
    background:#fff;
    padding:7px 14px;
    border-radius:6px;
    font-size:13px;
    cursor:pointer;
    color:var(--gris-texto);
  }
  .pill-btn.active{
    background:var(--verde-activo);
    color:#fff;
    border-color:var(--verde-activo);
  }
  .filterbar input[type="date"],
  .filterbar input[type="text"],
  .filterbar select{
    border:1px solid var(--borde);
    border-radius:6px;
    padding:7px 10px;
    font-size:13px;
    color:var(--gris-texto);
  }
  .btn-primary{
    background:var(--verde-activo);
    color:#fff;
    border:none;
    padding:8px 16px;
    border-radius:6px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .btn-outline{
    background:#fff;
    border:1px solid var(--verde-activo);
    color:var(--verde-activo);
    padding:8px 16px;
    border-radius:6px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .spacer{flex:1;}
  .status-line{
    background:#eaf4ec;
    color:#276443;
    font-size:12.5px;
    padding:8px 24px;
    border-bottom:1px solid var(--borde);
  }

  /* ===== MAIN LAYOUT ===== */
  .main{
    display:flex;
    flex-direction:column;
    gap:28px;
    padding:20px 24px 40px 24px;
  }

  /* ===== CAJAS DE CATEGORÍA ===== */
  section.categories h3.section-title{
    font-family:Georgia,serif;
    color:var(--verde-oscuro-2);
    font-size:18px;
    margin-bottom:12px;
  }
  .cat-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(190px,1fr));
    gap:16px;
  }
  .cat-box{
    background:#fff;
    border:1px solid var(--borde);
    border-radius:10px;
    overflow:hidden;
    cursor:pointer;
    transition:box-shadow .15s, border-color .15s;
    display:flex;
    flex-direction:column;
  }
  .cat-box:hover{
    box-shadow:0 4px 14px rgba(23,54,40,0.12);
    border-color:var(--dorado);
  }
  .cat-box.active{
    border-color:var(--dorado);
    box-shadow:0 0 0 2px rgba(201,162,39,0.35);
  }
  .cat-box-img{
    width:100%;
    height:100px;
    background:var(--verde-claro-bg);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    color:var(--verde-oscuro-2);
    background-size:cover;
    background-position:center;
  }
  .cat-box-body{
    padding:10px 12px 12px 12px;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .cat-box-title{
    font-size:14px;
    font-weight:700;
    color:var(--verde-oscuro-2);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:6px;
  }
  .cat-box-desc{
    font-size:11.5px;
    color:var(--gris-suave);
    line-height:1.3;
  }
  .cat-box .cat-count{
    background:var(--verde-claro-bg);
    color:var(--verde-oscuro-2);
    font-size:11px;
    padding:2px 8px;
    border-radius:10px;
    flex-shrink:0;
  }
  .cat-box.active .cat-count{
    background:var(--verde-activo);
    color:#fff;
  }
  .cat-box-add{
    background:#fff;
    border:2px dashed var(--borde);
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:150px;
    color:var(--verde-activo);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    text-align:center;
    padding:12px;
  }
  .cat-box-add:hover{ border-color:var(--verde-activo); background:var(--verde-claro-bg); }

  section.content{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .content-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .content-header h2{
    font-family:Georgia,serif;
    color:var(--verde-oscuro-2);
    font-size:22px;
  }
  .content-header .count-sub{
    font-size:13px;
    color:var(--gris-suave);
  }
  .btn-back{
    display:inline-flex;
    align-items:center;
    gap:6px;
    align-self:flex-start;
    background:var(--verde-oscuro-2);
    border:1px solid var(--dorado);
    color:#fff;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    padding:8px 16px;
    border-radius:20px;
    margin-bottom:10px;
    transition:background .15s;
  }
  .btn-back:hover{ background:var(--verde-activo); }
  .content-header-left{
    display:flex;
    flex-direction:column;
  }

  .doc-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(240px,1fr));
    gap:16px;
  }
  .doc-card{
    background:#fff;
    border:1px solid var(--borde);
    border-radius:10px;
    padding:14px;
    display:flex;
    flex-direction:column;
    gap:8px;
    transition:box-shadow .15s;
  }
  .doc-card:hover{
    box-shadow:0 4px 14px rgba(23,54,40,0.12);
    border-color:var(--dorado);
  }
  .doc-icon-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .doc-icon{
    width:38px; height:38px;
    border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    font-size:11px;
    font-weight:700;
    flex-shrink:0;
  }
  .doc-icon.pdf{ background:#fdecec; color:#c0392b; }
  .doc-icon.doc{ background:#e8eefc; color:#2554c7; }
  .doc-icon.xls{ background:#e6f6ec; color:#1f7a3f; }
  .doc-icon.ppt{ background:#fdeee0; color:#c9660a; }
  .doc-icon.otro{ background:var(--verde-claro-bg); color:var(--verde-oscuro-2); }
  .doc-title{
    font-size:14.5px;
    font-weight:600;
    color:var(--gris-texto);
    line-height:1.25;
  }
  .doc-desc{
    font-size:12.5px;
    color:var(--gris-suave);
    line-height:1.4;
  }
  .doc-tags{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  .tag{
    background:var(--verde-claro-bg);
    color:var(--verde-oscuro-2);
    font-size:11px;
    padding:3px 9px;
    border-radius:12px;
  }
  .doc-meta{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    color:#9aa79f;
    border-top:1px dashed var(--borde);
    padding-top:8px;
    margin-top:2px;
  }
  .doc-actions{
    display:flex;
    gap:8px;
  }
  .doc-actions button{
    flex:1;
    font-size:12px;
    padding:6px 0;
    border-radius:6px;
    cursor:pointer;
    border:1px solid var(--borde);
    background:#fff;
    color:var(--gris-texto);
  }
  .doc-actions button.primary{
    background:var(--verde-activo);
    color:#fff;
    border-color:var(--verde-activo);
  }

  /* ===== MODAL ===== */
  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(15,36,25,0.55);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50;
  }
  .modal-overlay.open{ display:flex; }
  .modal{
    background:#fff;
    width:420px;
    max-width:92vw;
    border-radius:12px;
    overflow:hidden;
    border-top:4px solid var(--dorado);
  }
  .modal-head{
    background:var(--verde-oscuro-2);
    color:#fff;
    padding:16px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family:Georgia,serif;
    font-size:17px;
  }
  .modal-head button{
    background:none; border:none; color:#fff; font-size:18px; cursor:pointer;
  }
  .modal-body{
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .modal-body label{
    font-size:12.5px;
    color:var(--gris-suave);
    display:block;
    margin-bottom:5px;
  }
  .modal-body input[type="text"],
  .modal-body input[type="file"],
  .modal-body select,
  .modal-body textarea{
    width:100%;
    border:1px solid var(--borde);
    border-radius:6px;
    padding:8px 10px;
    font-size:13px;
    font-family:inherit;
  }
  .modal-body textarea{ resize:vertical; min-height:60px; }
  .modal-footer{
    padding:14px 20px 20px 20px;
    display:flex;
    justify-content:flex-end;
    gap:10px;
  }

  footer.app-footer{
    text-align:center;
    font-size:11.5px;
    color:var(--gris-suave);
    padding:16px;
  }

  @media (max-width:760px){
    .cat-grid{ grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); }
  }
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="brand-text">
      <div class="kicker">Repositorio Digital</div>
      <h1>Gestión de Documentos</h1>
      <div class="subtitle">Categorías · Archivos · Control de Versiones</div>
    </div>
  </div>
</header>

<div class="filterbar">
  <span id="date-filter" style="display:none; align-items:center; gap:10px;">
    <label class="small">Desde</label>
    <input type="date">
    <label class="small">Hasta</label>
    <input type="date">
  </span>

  <input type="text" placeholder="Buscar por nombre, descripción o tag..." style="min-width:220px;">

  <select>
    <option>Todas las categorías</option>
    <option>Contratos</option>
    <option>Facturas</option>
    <option>Recursos Humanos</option>
    <option>Certificados</option>
  </select>

  <button class="pill-btn">Limpiar</button>
  <div class="spacer"></div>
  <button class="btn-outline" id="btn-nueva-cat">+ Nueva categoría</button>
</div>

<div class="status-line" id="status-line">Datos actualizados correctamente — sistema listo</div>

<div class="main">
  <section class="categories">
    <h3 class="section-title">Categorías</h3>
    <div class="cat-grid" id="cat-grid">
      <!-- Las cajas se generan dinámicamente desde categoriasData (ver JS) -->
    </div>
  </section>

  <section class="content" id="content-section" style="display:none;">
    <div class="content-header">
      <div class="content-header-left">
        <button class="btn-back" id="btn-volver-cats">← Volver a categorías</button>
        <h2 id="content-title">Categoría</h2>
        <span class="count-sub" id="content-count">0 documentos encontrados</span>
      </div>
      <button class="btn-primary" id="btn-nuevo-doc">+ Subir documento</button>
    </div>

    <div class="doc-grid" id="doc-grid">
      <!-- Las tarjetas se generan dinámicamente desde docsData (ver JS) -->
    </div>
  </section>
</div>

<footer class="app-footer">Horti Organic — Sistema de Gestión Documental</footer>

<!-- ===== MODAL: NUEVO DOCUMENTO ===== -->
<div class="modal-overlay" id="modal-doc">
  <div class="modal">
    <div class="modal-head">
      <span>Subir documento</span>
      <button id="close-modal-doc">✕</button>
    </div>
    <div class="modal-body">
      <div>
        <label>Archivo (PDF, Word, Excel o PowerPoint)</label>
        <input type="file" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx" id="doc-file-input">
      </div>
      <div>
        <label>Nombre del documento</label>
        <input type="text" id="doc-nombre-input" placeholder="Ej: Contrato proveedor Norte 2026">
      </div>
      <div>
        <label>Categoría</label>
        <select id="doc-cat-select"></select>
      </div>
      <div>
        <label>Descripción</label>
        <textarea id="doc-desc-input" placeholder="Breve descripción del contenido del documento"></textarea>
      </div>
      <div>
        <label>Tags (separados por coma)</label>
        <input type="text" id="doc-tags-input" placeholder="Ej: 2026, proveedor, urgente">
      </div>
      <div id="doc-error" style="display:none; color:#c0392b; font-size:12.5px;"></div>
    </div>
    <div class="modal-footer">
      <button class="pill-btn" id="cancel-modal-doc">Cancelar</button>
      <button class="btn-primary" id="btn-guardar-doc">Guardar documento</button>
    </div>
  </div>
</div>

<!-- ===== MODAL: NUEVA CATEGORÍA ===== -->
<div class="modal-overlay" id="modal-cat">
  <div class="modal">
    <div class="modal-head">
      <span>Nueva categoría</span>
      <button id="close-modal-cat">✕</button>
    </div>
    <div class="modal-body">
      <div>
        <label>Nombre de la categoría</label>
        <input type="text" id="cat-nombre-input" placeholder="Ej: Auditorías">
      </div>
      <div>
        <label>Descripción (opcional)</label>
        <textarea id="cat-desc-input" placeholder="Para qué se usa esta categoría"></textarea>
      </div>
      <div>
        <label>Imagen de la categoría (opcional)</label>
        <input type="file" accept="image/*" id="cat-image-input">
        <img id="cat-image-preview" alt="" style="display:none; margin-top:8px; width:100%; height:100px; object-fit:cover; border-radius:6px; border:1px solid var(--borde);">
      </div>
      <div id="cat-error" style="display:none; color:#c0392b; font-size:12.5px;"></div>
    </div>
    <div class="modal-footer">
      <button class="pill-btn" id="cancel-modal-cat">Cancelar</button>
      <button class="btn-primary" id="btn-crear-cat">Crear categoría</button>
    </div>
  </div>
</div>

<script>
  /* =========================================================
     CONEXIÓN CON EL BACKEND (Apps Script como API JSON)
     El Web App publicado responde a doGet (lecturas, vía query
     string) y doPost (escrituras, vía body JSON). Reemplazá
     WEBAPP_URL por la URL de TU propia implementación si cambia.
     ========================================================= */
  const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwjk9NXczC5BB1Q7gd46aCmb41CwfggTNaHP8BHNYCcFBb58z-OJkhDsXX1LDeL40E/exec";

  // PIN requerido para eliminar categorías o documentos.
  // Nota: esto es una traba de uso, no seguridad real (cualquiera que
  // vea el código fuente puede verlo). El PIN también se valida en el
  // servidor (Code.gs) para que no baste con editar el HTML.
  const PIN_ELIMINAR = "Horti123++";

  let categoriaActual = null; // nombre de la categoría abierta (null = ninguna)

  function mostrarEstado(msg, esError){
    const linea = document.getElementById("status-line");
    linea.textContent = msg;
    linea.style.background = esError ? "#fdecec" : "#eaf4ec";
    linea.style.color = esError ? "#c0392b" : "#276443";
  }

  async function apiGet(accion, params){
    const url = new URL(WEBAPP_URL);
    url.searchParams.set("accion", accion);
    Object.entries(params || {}).forEach(([k, v]) => {
      if(v !== null && v !== undefined && v !== "") url.searchParams.set(k, v);
    });
    const res = await fetch(url.toString());
    const json = await res.json();
    if(!json.success) throw new Error(json.error || "Error desconocido del servidor.");
    return json.data;
  }

  async function apiPost(accion, datos){
    const res = await fetch(WEBAPP_URL, {
      method: "POST",
      // text/plain evita que el navegador dispare un preflight CORS
      // (Apps Script no responde bien a peticiones OPTIONS).
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ accion, ...datos })
    });
    const json = await res.json();
    if(!json.success) throw new Error(json.error || "Error desconocido del servidor.");
    return json.data;
  }

  function archivoABase64(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(",")[1]); // quita el prefijo data:...;base64,
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  /* ===== CATEGORÍAS ===== */
  function renderCategorias(lista){
    const grid = document.getElementById("cat-grid");
    grid.innerHTML = "";

    const todos = { nombre:"Todos", descripcion:"Ver todos los documentos", imagen:"",
      count: lista.reduce((acc, c) => acc + c.count, 0) };

    [todos, ...lista].forEach((cat, idx) => {
      const box = document.createElement("div");
      box.className = "cat-box" + (idx === 0 ? " active" : "");
      const imgStyle = cat.imagen ? `background-image:url('${cat.imagen}');` : "";
      box.innerHTML = `
        <div class="cat-box-img" style="${imgStyle}">${cat.imagen ? "" : "📁"}</div>
        <div class="cat-box-body">
          <div class="cat-box-title"><span>${cat.nombre}</span><span class="cat-count">${cat.count}</span></div>
          <div class="cat-box-desc">${cat.descripcion || ""}</div>
        </div>
      `;
      box.addEventListener("click", ()=> abrirCategoria(cat));
      grid.appendChild(box);
    });

    const addBox = document.createElement("div");
    addBox.className = "cat-box-add";
    addBox.textContent = "+ Agregar categoría";
    addBox.addEventListener("click", ()=> modalCat.classList.add("open"));
    grid.appendChild(addBox);

    // Refresca las opciones del <select> de categoría en el modal de subir documento
    const select = document.getElementById("doc-cat-select");
    select.innerHTML = lista.map(c => `<option value="${c.nombre}">${c.nombre}</option>`).join("");
  }

  /* ===== DOCUMENTOS ===== */
  function infoTipoArchivo(tipo){
    const t = (tipo || "").toUpperCase();
    if(t === "PDF") return { clase:"pdf", etiqueta:"PDF" };
    if(["DOC","DOCX"].includes(t)) return { clase:"doc", etiqueta:"DOC" };
    if(["XLS","XLSX"].includes(t)) return { clase:"xls", etiqueta:"XLS" };
    if(["PPT","PPTX"].includes(t)) return { clase:"ppt", etiqueta:"PPT" };
    return { clase:"otro", etiqueta: t || "?" };
  }

  function renderDocs(lista){
    const grid = document.getElementById("doc-grid");
    grid.innerHTML = "";
    lista.forEach(doc => {
      const card = document.createElement("div");
      card.className = "doc-card";
      const info = infoTipoArchivo(doc.tipo);
      card.innerHTML = `
        <div class="doc-icon-row">
          <div class="doc-icon ${info.clase}">${info.etiqueta}</div>
          <div class="doc-title">${doc.nombre}</div>
        </div>
        <div class="doc-desc">${doc.descripcion}</div>
        <div class="doc-tags">
          <span class="tag">${doc.categoria}</span>
          ${doc.tags.map(t => `<span class="tag">${t}</span>`).join("")}
        </div>
        <div class="doc-meta">
          <span>${doc.autor}</span>
          <span>${doc.fecha}</span>
        </div>
        <div class="doc-actions">
          <button class="primary" data-accion="ver">Abrir</button>
          <button data-accion="eliminar">Eliminar</button>
        </div>
      `;
      card.querySelector('[data-accion="ver"]').addEventListener("click", ()=>{
        window.open(doc.url, "_blank");
      });
      card.querySelector('[data-accion="eliminar"]').addEventListener("click", ()=>{
        const pin = prompt(`Para eliminar "${doc.nombre}" ingresá el PIN de administración:`);
        if(pin === null) return; // canceló
        if(pin !== PIN_ELIMINAR){
          mostrarEstado("PIN incorrecto. No se eliminó el documento.", true);
          return;
        }
        if(!confirm(`¿Eliminar "${doc.nombre}"? Se moverá a la papelera.`)) return;
        apiPost("eliminarDocumento", { id: doc.id, pin })
          .then(()=>{
            mostrarEstado("Documento eliminado.", false);
            abrirCategoria({ nombre: categoriaActual });
            cargarCategorias();
          })
          .catch(err => mostrarEstado("No se pudo eliminar: " + err.message, true));
      });
      grid.appendChild(card);
    });
  }

  /* Abrir la vista de una categoría: oculta las cajas y muestra solo sus documentos */
  const categoriesSection = document.getElementById("cat-grid").closest("section.categories");
  const contentSection = document.getElementById("content-section");

  function abrirCategoria(cat){
    categoriaActual = cat.nombre;
    const esTodos = cat.nombre === "Todos";

    document.getElementById("content-title").textContent =
      esTodos ? "Todos los Documentos" : cat.nombre;

    categoriesSection.style.display = "none";
    contentSection.style.display = "flex";
    document.getElementById("date-filter").style.display = "flex";
    document.getElementById("btn-nuevo-doc").style.display = esTodos ? "none" : "inline-flex";

    mostrarEstado("Cargando documentos...", false);
    apiGet("listarDocumentos", { categoria: esTodos ? "" : cat.nombre })
      .then(docs => {
        renderDocs(docs);
        document.getElementById("content-count").textContent =
          `${docs.length} documento${docs.length === 1 ? "" : "s"} encontrado${docs.length === 1 ? "" : "s"}`;
        mostrarEstado("Datos actualizados correctamente.", false);
      })
      .catch(err => mostrarEstado("No se pudieron cargar los documentos: " + err.message, true));
  }

  document.getElementById("btn-volver-cats").addEventListener("click", ()=>{
    contentSection.style.display = "none";
    categoriesSection.style.display = "block";
    document.getElementById("date-filter").style.display = "none";
    categoriaActual = null;
  });

  /* ===== MODALES ===== */
  const modalDoc = document.getElementById("modal-doc");
  const modalCat = document.getElementById("modal-cat");

  document.getElementById("btn-nuevo-doc").onclick = ()=>{
    const select = document.getElementById("doc-cat-select");
    if(categoriaActual && [...select.options].some(o => o.value === categoriaActual)){
      select.value = categoriaActual;
    }
    document.getElementById("doc-error").style.display = "none";
    modalDoc.classList.add("open");
  };
  document.getElementById("close-modal-doc").onclick = ()=> modalDoc.classList.remove("open");
  document.getElementById("cancel-modal-doc").onclick = ()=> modalDoc.classList.remove("open");

  document.getElementById("btn-nueva-cat").onclick = ()=>{
    document.getElementById("cat-error").style.display = "none";
    modalCat.classList.add("open");
  };
  document.getElementById("close-modal-cat").onclick = ()=> modalCat.classList.remove("open");
  document.getElementById("cancel-modal-cat").onclick = ()=> modalCat.classList.remove("open");

  /* Vista previa de la imagen de categoría al seleccionar archivo */
  document.getElementById("cat-image-input").addEventListener("change", (e)=>{
    const file = e.target.files[0];
    const preview = document.getElementById("cat-image-preview");
    if(file){
      preview.src = URL.createObjectURL(file);
      preview.style.display = "block";
    } else {
      preview.style.display = "none";
    }
  });

  /* Guardar documento */
  document.getElementById("btn-guardar-doc").addEventListener("click", async ()=>{
    const errorBox = document.getElementById("doc-error");
    errorBox.style.display = "none";

    const fileInput = document.getElementById("doc-file-input");
    const nombre = document.getElementById("doc-nombre-input").value.trim();
    const categoria = document.getElementById("doc-cat-select").value;
    const descripcion = document.getElementById("doc-desc-input").value.trim();
    const tags = document.getElementById("doc-tags-input").value.trim();
    const archivo = fileInput.files[0];

    if(!nombre || !categoria || !archivo){
      errorBox.textContent = "Completá el nombre, la categoría y adjuntá un archivo.";
      errorBox.style.display = "block";
      return;
    }

    const btn = document.getElementById("btn-guardar-doc");
    btn.disabled = true;
    btn.textContent = "Guardando...";

    try{
      const archivoBase64 = await archivoABase64(archivo);
      await apiPost("subirDocumento", {
        nombre, categoria, descripcion, tags,
        archivoBase64,
        archivoNombre: archivo.name,
        archivoTipo: archivo.type || "application/octet-stream"
      });
      modalDoc.classList.remove("open");
      fileInput.value = "";
      document.getElementById("doc-nombre-input").value = "";
      document.getElementById("doc-desc-input").value = "";
      document.getElementById("doc-tags-input").value = "";
      mostrarEstado("Documento subido correctamente.", false);
      abrirCategoria({ nombre: categoria });
      cargarCategorias();
    }catch(err){
      errorBox.textContent = "No se pudo subir el documento: " + err.message;
      errorBox.style.display = "block";
    }finally{
      btn.disabled = false;
      btn.textContent = "Guardar documento";
    }
  });

  /* Crear categoría */
  document.getElementById("btn-crear-cat").addEventListener("click", async ()=>{
    const errorBox = document.getElementById("cat-error");
    errorBox.style.display = "none";

    const nombre = document.getElementById("cat-nombre-input").value.trim();
    const descripcion = document.getElementById("cat-desc-input").value.trim();
    const imagenInput = document.getElementById("cat-image-input");
    const imagen = imagenInput.files[0];

    if(!nombre){
      errorBox.textContent = "El nombre de la categoría es obligatorio.";
      errorBox.style.display = "block";
      return;
    }

    const btn = document.getElementById("btn-crear-cat");
    btn.disabled = true;
    btn.textContent = "Creando...";

    try{
      const datos = { nombre, descripcion };
      if(imagen){
        datos.imagenBase64 = await archivoABase64(imagen);
        datos.imagenNombre = imagen.name;
        datos.imagenTipo = imagen.type || "image/png";
      }
      await apiPost("crearCategoria", datos);
      modalCat.classList.remove("open");
      document.getElementById("cat-nombre-input").value = "";
      document.getElementById("cat-desc-input").value = "";
      imagenInput.value = "";
      document.getElementById("cat-image-preview").style.display = "none";
      mostrarEstado("Categoría creada correctamente.", false);
      cargarCategorias();
    }catch(err){
      errorBox.textContent = "No se pudo crear la categoría: " + err.message;
      errorBox.style.display = "block";
    }finally{
      btn.disabled = false;
      btn.textContent = "Crear categoría";
    }
  });

  /* ===== CARGA INICIAL ===== */
  function cargarCategorias(){
    return apiGet("listarCategorias")
      .then(cats => renderCategorias(cats))
      .catch(err => mostrarEstado("No se pudieron cargar las categorías: " + err.message, true));
  }

  mostrarEstado("Cargando...", false);
  cargarCategorias().then(()=> mostrarEstado("Datos actualizados correctamente — sistema listo", false));
</script>

</body>
</html>
