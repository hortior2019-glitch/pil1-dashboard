<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="icon" href="data:,">
  <meta name="theme-color" content="#1a4a2e" />
  <title>Control de Viajes Internos</title>
  <style>
    :root {
      --verde-oscuro:  #1a4a2e;
      --verde-medio:   #2d6a45;
      --verde-claro:   #4a9466;
      --dorado:        #c8a84b;
      --crema:         #f5f2eb;
      --crema-oscura:  #ece8df;
      --texto:         #1c1c1c;
      --texto-suave:   #555;
      --blanco:        #ffffff;
      --amarillo-bg:   #fff8dc;
      --verde-bg:      #d5f5e3;
      --rojo:          #e74c3c;
      --rojo-bg:       #fde8e8;
      --gris:          #95a5a6;
      --gris-bg:       #ecf0f1;
      --radio:         14px;
      --sombra:        0 4px 20px rgba(0,0,0,0.10);
      --sombra-fuerte: 0 8px 32px rgba(0,0,0,0.18);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      background: var(--crema);
      color: var(--texto);
      overflow-x: hidden;
    }

    .header {
      background: var(--verde-oscuro);
      color: var(--blanco);
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .header-logo {
      width: 36px; height: 36px;
      background: var(--dorado);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 14px; color: var(--verde-oscuro);
      letter-spacing: 0.5px;
    }
    .header-title { font-size: 17px; font-weight: 700; letter-spacing: 0.3px; }
    .header-subtitle { font-size: 11px; opacity: 0.7; margin-top: 1px; }
    .header-center { text-align: center; flex: 1; }
    .header-right { width: 36px; }
    .btn-cerrar-sesion {
      background: none; border: 1px solid rgba(255,255,255,0.3);
      color: var(--blanco); border-radius: 8px;
      padding: 6px 10px; font-size: 12px; cursor: pointer;
    }

    .screen { display: none; min-height: calc(100vh - 60px); }
    .screen.activa { display: block; }

    /* ── LOGIN ── */
    .login-wrap {
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 32px 24px;
      background: linear-gradient(160deg, var(--verde-oscuro) 0%, var(--verde-medio) 100%);
    }
    .login-logo {
      width: 72px; height: 72px;
      background: var(--dorado);
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; font-weight: 900; color: var(--verde-oscuro);
      margin-bottom: 20px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.3);
    }
    .login-titulo {
      color: var(--blanco); font-size: 22px; font-weight: 700;
      text-align: center; margin-bottom: 4px;
    }
    .login-subtitulo {
      color: rgba(255,255,255,0.6); font-size: 14px;
      text-align: center; margin-bottom: 36px;
    }
    .login-card {
      background: var(--blanco);
      border-radius: 20px;
      padding: 28px 24px;
      width: 100%; max-width: 360px;
      box-shadow: var(--sombra-fuerte);
    }
    .login-label {
      font-size: 13px; font-weight: 600;
      color: var(--texto-suave); margin-bottom: 16px;
      text-align: center; letter-spacing: 0.5px; text-transform: uppercase;
    }
    .pin-display {
      display: flex; justify-content: center; gap: 12px;
      margin-bottom: 28px;
    }
    .pin-dot {
      width: 16px; height: 16px;
      border-radius: 50%;
      border: 2px solid var(--crema-oscura);
      background: var(--crema);
      transition: all 0.15s;
    }
    .pin-dot.lleno {
      background: var(--verde-oscuro);
      border-color: var(--verde-oscuro);
      transform: scale(1.15);
    }
    .teclado {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .tecla {
      aspect-ratio: 1;
      background: var(--crema);
      border: none; border-radius: 14px;
      font-size: 22px; font-weight: 600;
      color: var(--texto);
      cursor: pointer;
      transition: background 0.1s, transform 0.1s;
      display: flex; align-items: center; justify-content: center;
    }
    .tecla:active { background: var(--crema-oscura); transform: scale(0.93); }
    .tecla.borrar { font-size: 16px; color: var(--texto-suave); }
    .tecla.vacio { visibility: hidden; }
    .btn-ingresar {
      width: 100%; margin-top: 20px;
      background: var(--verde-oscuro);
      color: var(--blanco);
      border: none; border-radius: 14px;
      padding: 16px; font-size: 16px; font-weight: 700;
      cursor: pointer; letter-spacing: 0.5px;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-ingresar:active { transform: scale(0.98); }
    .btn-ingresar:disabled { background: var(--gris); cursor: not-allowed; }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #333; color: #fff;
      padding: 12px 24px; border-radius: 100px;
      font-size: 14px; font-weight: 500;
      z-index: 9999; opacity: 0;
      transition: opacity 0.25s;
      white-space: nowrap;
      pointer-events: none;
    }
    .toast.visible { opacity: 1; }
    .toast.error { background: var(--rojo); }
    .toast.exito { background: var(--verde-claro); }

    /* ── INICIO ── */
    .inicio-contenido { padding: 20px 16px 100px; }
    .bienvenida-card {
      background: var(--verde-oscuro);
      color: var(--blanco);
      border-radius: var(--radio);
      padding: 20px;
      margin-bottom: 20px;
    }
    .bienvenida-nombre { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .bienvenida-fecha { font-size: 13px; opacity: 0.7; }

    .stats-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 12px; margin-bottom: 20px;
    }
    .stat-card {
      background: var(--blanco);
      border-radius: var(--radio);
      padding: 16px;
      box-shadow: var(--sombra);
      text-align: center;
    }
    .stat-numero { font-size: 32px; font-weight: 800; color: var(--verde-oscuro); }
    .stat-label { font-size: 12px; color: var(--texto-suave); margin-top: 4px; font-weight: 500; }

    .btn-nuevo-viaje {
      width: 100%;
      background: var(--dorado);
      color: var(--verde-oscuro);
      border: none; border-radius: var(--radio);
      padding: 18px; font-size: 17px; font-weight: 800;
      cursor: pointer; letter-spacing: 0.3px;
      box-shadow: var(--sombra);
      margin-bottom: 24px;
      transition: transform 0.1s;
    }
    .btn-nuevo-viaje:active { transform: scale(0.98); }

    .viajes-hoy-titulo {
      font-size: 14px; font-weight: 700;
      color: var(--texto-suave); text-transform: uppercase;
      letter-spacing: 0.8px; margin-bottom: 12px;
    }
    .viaje-card {
      background: var(--blanco);
      border-radius: var(--radio);
      padding: 14px 16px;
      margin-bottom: 10px;
      box-shadow: var(--sombra);
    }
    .viaje-card-top {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 6px;
    }
    .viaje-card-tractor { font-size: 14px; font-weight: 700; }
    .viaje-card-ton {
      background: var(--verde-bg);
      color: var(--verde-oscuro);
      padding: 3px 10px; border-radius: 100px;
      font-size: 13px; font-weight: 700;
    }
    .viaje-card-ruta { font-size: 13px; color: var(--texto-suave); }
    .viaje-card-dur { font-size: 12px; color: var(--gris); margin-top: 4px; }

    /* ── CONFIG ── */
    .config-contenido { padding: 20px 16px 100px; }
    .seccion-titulo {
      font-size: 13px; font-weight: 700;
      color: var(--texto-suave); text-transform: uppercase;
      letter-spacing: 0.8px; margin: 20px 0 10px;
    }
    .seccion-titulo:first-child { margin-top: 0; }

    .selector-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .selector-item {
      background: var(--blanco);
      border: 2px solid transparent;
      border-radius: var(--radio);
      padding: 14px 12px;
      cursor: pointer;
      text-align: center;
      box-shadow: var(--sombra);
      transition: border-color 0.15s, background 0.15s;
    }
    .selector-item.seleccionado {
      border-color: var(--verde-oscuro);
      background: var(--verde-bg);
    }
    .selector-item-nombre { font-size: 14px; font-weight: 600; }
    .selector-item-detalle { font-size: 12px; color: var(--texto-suave); margin-top: 3px; }

    .selector-lista { display: flex; flex-direction: column; gap: 8px; }
    .selector-fila {
      background: var(--blanco);
      border: 2px solid transparent;
      border-radius: var(--radio);
      padding: 14px 16px;
      cursor: pointer;
      box-shadow: var(--sombra);
      font-size: 15px; font-weight: 500;
      transition: border-color 0.15s, background 0.15s;
    }
    .selector-fila.seleccionado {
      border-color: var(--verde-oscuro);
      background: var(--verde-bg);
      font-weight: 700;
    }

    .btn-continuar {
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 16px;
      background: var(--crema);
      border-top: 1px solid var(--crema-oscura);
    }
    .btn-continuar button {
      width: 100%;
      background: var(--verde-oscuro);
      color: var(--blanco);
      border: none; border-radius: var(--radio);
      padding: 16px; font-size: 16px; font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .btn-continuar button:active { transform: scale(0.98); }
    .btn-continuar button:disabled { background: var(--gris); cursor: not-allowed; }

    /* ── PULSAZOS ── */
    .pulsazos-contenido { padding: 16px 16px 100px; }

    .viaje-resumen {
      background: var(--blanco);
      border-radius: var(--radio);
      padding: 14px 16px;
      margin-bottom: 20px;
      box-shadow: var(--sombra);
      font-size: 14px; color: var(--texto-suave);
      line-height: 1.6;
    }
    .viaje-resumen strong { color: var(--texto); }

    .pulsos-lista { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }

    .pulso-btn {
      display: flex; align-items: center; gap: 16px;
      padding: 18px 20px;
      border-radius: var(--radio);
      border: none; cursor: pointer;
      width: 100%; text-align: left;
      box-shadow: var(--sombra);
      transition: transform 0.1s, opacity 0.2s;
    }
    .pulso-btn:active { transform: scale(0.98); }
    .pulso-btn.completado { opacity: 0.6; cursor: default; }
    .pulso-btn.pendiente { opacity: 0.45; cursor: not-allowed; }

    .pulso-btn.p1 { background: #fff3cd; }
    .pulso-btn.p2 { background: #d4edda; }
    .pulso-btn.p3 { background: #f8d7da; }
    .pulso-btn.p4 { background: #e2e3e5; }

    .pulso-indicador {
      width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0;
    }
    .p1 .pulso-indicador { background: #f0ad00; }
    .p2 .pulso-indicador { background: #28a745; }
    .p3 .pulso-indicador { background: #dc3545; }
    .p4 .pulso-indicador { background: #6c757d; }

    .pulso-info { flex: 1; }
    .pulso-nombre { font-size: 16px; font-weight: 700; }
    .pulso-hora { font-size: 13px; color: var(--texto-suave); margin-top: 2px; }
    .pulso-check { font-size: 18px; }

    .cronometro {
      text-align: center;
      background: var(--blanco);
      border-radius: var(--radio);
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: var(--sombra);
    }
    .cronometro-label { font-size: 12px; color: var(--texto-suave); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .cronometro-tiempo { font-size: 36px; font-weight: 800; color: var(--verde-oscuro); font-variant-numeric: tabular-nums; }

    /* ── CARGA ── */
    .carga-opciones { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .carga-opcion {
      display: flex; align-items: center; gap: 16px;
      background: var(--blanco);
      border: 2px solid transparent;
      border-radius: var(--radio);
      padding: 16px 20px;
      cursor: pointer;
      box-shadow: var(--sombra);
      transition: border-color 0.15s, background 0.15s;
    }
    .carga-opcion.seleccionado {
      border-color: var(--verde-oscuro);
      background: var(--verde-bg);
    }
    .carga-barra-wrap { flex: 1; height: 10px; background: var(--crema-oscura); border-radius: 5px; }
    .carga-barra { height: 100%; background: var(--verde-claro); border-radius: 5px; }
    .carga-label { font-size: 15px; font-weight: 600; min-width: 36px; }
    .carga-ton { font-size: 13px; color: var(--texto-suave); min-width: 60px; text-align: right; }

    .confirmacion-card {
      background: var(--blanco);
      border-radius: var(--radio);
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: var(--sombra);
      text-align: center;
    }
    .confirmacion-ton { font-size: 42px; font-weight: 900; color: var(--verde-oscuro); }
    .confirmacion-label { font-size: 14px; color: var(--texto-suave); margin-top: 4px; }

    .btn-guardar {
      width: 100%;
      background: var(--verde-oscuro);
      color: var(--blanco);
      border: none; border-radius: var(--radio);
      padding: 18px; font-size: 17px; font-weight: 800;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .btn-guardar:active { transform: scale(0.98); }
    .btn-guardar:disabled { background: var(--gris); cursor: not-allowed; }

    .loading-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center;
      z-index: 9998;
    }
    .loading-spinner {
      width: 48px; height: 48px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: var(--blanco);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .offline-banner {
      background: #f39c12; color: #fff;
      text-align: center; padding: 8px;
      font-size: 13px; font-weight: 600;
    }
  </style>
</head>
<body>

<!-- OFFLINE BANNER -->
<div class="offline-banner" id="offlineBanner" style="display:none">Sin conexion — los viajes se guardaran localmente</div>

<!-- PANTALLA LOGIN -->
<div id="screenLogin" class="login-wrap">
  <div class="login-logo">CV</div>
  <div class="login-titulo">Control de Viajes</div>
  <div class="login-subtitulo">Ingresa tu PIN para continuar</div>
  <div class="login-card">
    <div class="login-label">PIN de acceso</div>
    <div class="pin-display">
      <div class="pin-dot" id="dot0"></div>
      <div class="pin-dot" id="dot1"></div>
      <div class="pin-dot" id="dot2"></div>
      <div class="pin-dot" id="dot3"></div>
    </div>
    <div class="teclado">
      <button class="tecla" onclick="teclaPin('1')">1</button>
      <button class="tecla" onclick="teclaPin('2')">2</button>
      <button class="tecla" onclick="teclaPin('3')">3</button>
      <button class="tecla" onclick="teclaPin('4')">4</button>
      <button class="tecla" onclick="teclaPin('5')">5</button>
      <button class="tecla" onclick="teclaPin('6')">6</button>
      <button class="tecla" onclick="teclaPin('7')">7</button>
      <button class="tecla" onclick="teclaPin('8')">8</button>
      <button class="tecla" onclick="teclaPin('9')">9</button>
      <button class="tecla vacio"></button>
      <button class="tecla" onclick="teclaPin('0')">0</button>
      <button class="tecla borrar" onclick="borrarPin()">&#9003;</button>
    </div>
    <button class="btn-ingresar" id="btnIngresar" onclick="doLogin()" disabled>Ingresar</button>
  </div>
</div>

<!-- HEADER (pantallas internas) -->
<div class="header" id="mainHeader" style="display:none">
  <div class="header-logo">CV</div>
  <div class="header-center">
    <div class="header-title" id="headerTitle">Control de Viajes</div>
    <div class="header-subtitle" id="headerSubtitle"></div>
  </div>
  <div class="header-right">
    <button class="btn-cerrar-sesion" id="btnCerrarSesion" onclick="cerrarSesion()" style="display:none">Salir</button>
  </div>
</div>

<!-- PANTALLA INICIO -->
<div id="screenInicio" class="screen">
  <div class="inicio-contenido">
    <div class="bienvenida-card">
      <div class="bienvenida-nombre" id="bienvenidaNombre">Hola</div>
      <div class="bienvenida-fecha" id="bienvenidaFecha"></div>
    </div>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-numero" id="statViajes">0</div>
        <div class="stat-label">Viajes hoy</div>
      </div>
      <div class="stat-card">
        <div class="stat-numero" id="statTon">0</div>
        <div class="stat-label">Toneladas hoy</div>
      </div>
    </div>
    <button class="btn-nuevo-viaje" onclick="goToConfig()">+ Iniciar nuevo viaje</button>
    <div class="viajes-hoy-titulo">Viajes del dia</div>
    <div id="listaViajesHoy"></div>
  </div>
</div>

<!-- PANTALLA CONFIG -->
<div id="screenConfig" class="screen">
  <div class="config-contenido">
    <div class="seccion-titulo">Tractor</div>
    <div class="selector-grid" id="listaTractores"></div>

    <div class="seccion-titulo">Frente de origen</div>
    <div class="selector-lista" id="listaOrigen"></div>

    <div class="seccion-titulo">Frente de destino</div>
    <div class="selector-lista" id="listaDestino"></div>
  </div>
  <div class="btn-continuar">
    <button id="btnIrPulsazos" onclick="goToPulsazos()" disabled>Continuar</button>
  </div>
</div>

<!-- PANTALLA PULSAZOS -->
<div id="screenPulsazos" class="screen">
  <div class="pulsazos-contenido">
    <div class="viaje-resumen" id="viajeResumen"></div>

    <div class="cronometro" id="cronometroBox" style="display:none">
      <div class="cronometro-label">Tiempo del viaje</div>
      <div class="cronometro-tiempo" id="cronometroTiempo">00:00</div>
    </div>

    <div class="pulsos-lista">
      <button class="pulso-btn p1" id="btn1" onclick="registrarPulso(1)">
        <div class="pulso-indicador"></div>
        <div class="pulso-info">
          <div class="pulso-nombre">Cargando</div>
          <div class="pulso-hora" id="hora1">Toca para registrar</div>
        </div>
        <div class="pulso-check" id="check1"></div>
      </button>
      <button class="pulso-btn p2 pendiente" id="btn2" onclick="registrarPulso(2)">
        <div class="pulso-indicador"></div>
        <div class="pulso-info">
          <div class="pulso-nombre">En camino</div>
          <div class="pulso-hora" id="hora2">Esperando paso anterior</div>
        </div>
        <div class="pulso-check" id="check2"></div>
      </button>
      <button class="pulso-btn p3 pendiente" id="btn3" onclick="registrarPulso(3)">
        <div class="pulso-indicador"></div>
        <div class="pulso-info">
          <div class="pulso-nombre">Descargando</div>
          <div class="pulso-hora" id="hora3">Esperando paso anterior</div>
        </div>
        <div class="pulso-check" id="check4"></div>
      </button>
      <button class="pulso-btn p4 pendiente" id="btn4" onclick="registrarPulso(4)">
        <div class="pulso-indicador"></div>
        <div class="pulso-info">
          <div class="pulso-nombre">Completado</div>
          <div class="pulso-hora" id="hora4">Esperando paso anterior</div>
        </div>
        <div class="pulso-check" id="check4b"></div>
      </button>
    </div>
  </div>
</div>

<!-- PANTALLA CARGA -->
<div id="screenCarga" class="screen">
  <div class="pulsazos-contenido">
    <div class="carga-opciones" id="listaCarga"></div>
    <div class="confirmacion-card">
      <div class="cronometro-label">Toneladas estimadas</div>
      <div class="confirmacion-ton" id="tonConfirm">—</div>
      <div class="confirmacion-label" id="capacidadLabel"></div>
    </div>
    <button class="btn-guardar" id="btnGuardar" onclick="guardarViaje()" disabled>Guardar viaje</button>
  </div>
</div>

<!-- LOADING -->
<div class="loading-overlay" id="loadingOverlay" style="display:none">
  <div class="loading-spinner"></div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ============================================================
//  CONFIG
// ============================================================
const CONFIG = {
  APPS_SCRIPT_URL: "https://script.google.com/macros/s/AKfycbzDdC-fBDhB5GQPEk9FfnH1uWc5YgOuu8pKBEpi87mg55-YCox6v_JR6IkUkWIw_Hq3Eg/exec",
  CSV_TRACTORES: "https://raw.githubusercontent.com/hortior2019-glitch/pil1-dashboard/main/BD_Viajes_Principal%20-%20tractores.csv",
  CSV_FRENTES:   "https://raw.githubusercontent.com/hortior2019-glitch/pil1-dashboard/main/BD_Viajes_Principal%20-%20frentes.csv",
};

const SESION_KEY   = "vc_sesion";
const PENDING_KEY  = "vc_pendientes";
const DIAS_EXPIRA  = 30;

// ============================================================
//  ESTADO
// ============================================================
let sesion       = null;   // { nombre, usuario, expira }
let pinDigitos   = [];
let tractores    = [];
let frentes      = [];
let viajeActual  = {};     // config del viaje en curso
let cronInterval = null;

// ============================================================
//  INIT
// ============================================================
document.addEventListener("DOMContentLoaded", () => {
  verificarSesion();
  window.addEventListener("online",  () => { ocultarOffline(); sincronizarPendientes(); });
  window.addEventListener("offline", mostrarOffline);
  if (!navigator.onLine) mostrarOffline();
});

function mostrarOffline() { document.getElementById("offlineBanner").style.display = "block"; }
function ocultarOffline() { document.getElementById("offlineBanner").style.display = "none"; }

function verificarSesion() {
  try {
    const raw = localStorage.getItem(SESION_KEY);
    if (!raw) { mostrarLogin(); return; }
    const s = JSON.parse(raw);
    if (!s || !s.expira || Date.now() > s.expira) {
      localStorage.removeItem(SESION_KEY);
      mostrarLogin(); return;
    }
    sesion = s;
    mostrarInicio();
  } catch(e) { mostrarLogin(); }
}

// ============================================================
//  API
// ============================================================
// Google Apps Script hace un redirect que pierde los headers CORS.
// Solución: pasar por allorigins.win que hace el fetch server-side y retorna JSON limpio.
async function gasGet(params) {
  const base    = CONFIG.APPS_SCRIPT_URL;
  if (!base || base === "PEGAR_URL_AQUI") throw new Error("URL no configurada");
  const target  = encodeURIComponent(base + "?" + new URLSearchParams(params).toString());
  const proxy   = "https://api.allorigins.win/get?url=" + target;
  const res     = await fetch(proxy);
  if (!res.ok) throw new Error("HTTP proxy " + res.status);
  const wrapper = await res.json();          // { contents: "...", status: {...} }
  return JSON.parse(wrapper.contents);
}

async function apiFetch(params) {
  return gasGet(params);
}

async function apiPost(body) {
  // guardarViaje: metemos todo como params GET via proxy
  return gasGet(body);
}

async function fetchCSV(url) {
  const res   = await fetch(url);
  const text  = await res.text();
  const lines = text.trim().split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 2) return [];
  const headers = lines[0].split(",").map(h => h.trim());
  return lines.slice(1).map(line => {
    const vals = line.split(",").map(v => v.trim());
    const obj  = {};
    headers.forEach((h, i) => obj[h] = vals[i] || "");
    return obj;
  });
}

// ============================================================
//  LOGIN
// ============================================================
function mostrarLogin() {
  document.getElementById("screenLogin").style.display = "flex";
  document.getElementById("mainHeader").style.display  = "none";
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("activa"));
}

function teclaPin(d) {
  if (pinDigitos.length >= 4) return;
  pinDigitos.push(d);
  actualizarDots();
  if (pinDigitos.length === 4) {
    document.getElementById("btnIngresar").disabled = false;
  }
}

function borrarPin() {
  if (pinDigitos.length === 0) return;
  pinDigitos.pop();
  actualizarDots();
  document.getElementById("btnIngresar").disabled = true;
}

function actualizarDots() {
  for (let i = 0; i < 4; i++) {
    const dot = document.getElementById("dot" + i);
    dot.classList.toggle("lleno", i < pinDigitos.length);
  }
}

async function doLogin() {
  if (pinDigitos.length !== 4) { mostrarToast("Ingresa 4 digitos", "error"); return; }
  const pin = pinDigitos.join("");
  mostrarLoading();
  try {
    const res = await apiFetch({ action: "verificarPIN", pin });
    if (res.ok) {
      sesion = {
        nombre:  res.conductor.nombre,
        usuario: res.conductor.usuario,
        expira:  Date.now() + DIAS_EXPIRA * 86400000
      };
      localStorage.setItem(SESION_KEY, JSON.stringify(sesion));
      mostrarInicio();
    } else {
      mostrarToast(res.error || "PIN incorrecto", "error");
      pinDigitos = [];
      actualizarDots();
      document.getElementById("btnIngresar").disabled = true;
    }
  } catch(e) {
    mostrarToast("Sin conexion. Intenta de nuevo.", "error");
    pinDigitos = [];
    actualizarDots();
    document.getElementById("btnIngresar").disabled = true;
  } finally {
    ocultarLoading();
  }
}

function cerrarSesion() {
  localStorage.removeItem(SESION_KEY);
  sesion = null;
  pinDigitos = [];
  actualizarDots();
  document.getElementById("btnIngresar").disabled = true;
  mostrarLogin();
}

// ============================================================
//  INICIO
// ============================================================
async function mostrarInicio() {
  document.getElementById("screenLogin").style.display = "none";
  document.getElementById("mainHeader").style.display  = "flex";
  document.getElementById("headerTitle").textContent   = "Control de Viajes";
  document.getElementById("headerSubtitle").textContent = "";
  document.getElementById("btnCerrarSesion").style.display = "inline-block";

  document.querySelectorAll(".screen").forEach(s => s.classList.remove("activa"));
  document.getElementById("screenInicio").classList.add("activa");

  const fecha = new Date();
  const opts  = { weekday: "long", year: "numeric", month: "long", day: "numeric" };
  document.getElementById("bienvenidaNombre").textContent = "Hola, " + (sesion.nombre || "conductor");
  document.getElementById("bienvenidaFecha").textContent  = fecha.toLocaleDateString("es-ES", opts);

  cargarViajesHoy();
}

async function cargarViajesHoy() {
  try {
    const res = await apiFetch({ action: "getViajesHoy", conductor: sesion.nombre });
    if (res.ok) {
      const viajes = res.viajes || [];
      document.getElementById("statViajes").textContent = viajes.length;
      const tons = viajes.reduce((s, v) => s + parseFloat(v.toneladasEstimadas || 0), 0);
      document.getElementById("statTon").textContent = tons.toFixed(1);
      renderViajesHoy(viajes);
    }
  } catch(e) { /* offline, no pasa nada */ }
}

function renderViajesHoy(viajes) {
  const cont = document.getElementById("listaViajesHoy");
  if (!viajes.length) {
    cont.innerHTML = '<div style="text-align:center;color:var(--texto-suave);padding:32px 0;font-size:14px;">No hay viajes registrados hoy</div>';
    return;
  }
  cont.innerHTML = viajes.map(v => `
    <div class="viaje-card">
      <div class="viaje-card-top">
        <span class="viaje-card-tractor">${v.tractor || "—"}</span>
        <span class="viaje-card-ton">${parseFloat(v.toneladasEstimadas || 0).toFixed(1)} ton</span>
      </div>
      <div class="viaje-card-ruta">${v.frenteOrigen || "—"} → ${v.frenteDestino || "—"}</div>
      <div class="viaje-card-dur">${v.duracionMinutos ? v.duracionMinutos + " min" : ""} · ${v.nivelCarga || ""}</div>
    </div>
  `).join("");
}

// ============================================================
//  CONFIG VIAJE
// ============================================================
async function goToConfig() {
  document.getElementById("headerTitle").textContent    = "Nuevo viaje";
  document.getElementById("headerSubtitle").textContent = "Configura tu viaje";
  document.getElementById("btnCerrarSesion").style.display = "none";
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("activa"));
  document.getElementById("screenConfig").classList.add("activa");

  viajeActual = { conductor: sesion.nombre };

  mostrarLoading();
  try {
    const [tracs, frs] = await Promise.all([
      fetchCSV(CONFIG.CSV_TRACTORES),
      fetchCSV(CONFIG.CSV_FRENTES),
    ]);
    tractores = tracs;
    frentes   = frs;
    renderTractores();
    renderFrentes();
  } catch(e) {
    mostrarToast("Error cargando datos. Revisa conexion.", "error");
  } finally {
    ocultarLoading();
  }
}

function renderTractores() {
  const cont = document.getElementById("listaTractores");
  cont.innerHTML = tractores.map((t, i) => `
    <div class="selector-item" onclick="seleccionarTractor(${i})" id="tractor-${i}">
      <div class="selector-item-nombre">${t.Modelo || t.modelo || "Tractor " + (i+1)}</div>
      <div class="selector-item-detalle">${t.CapacidadTon || t.capacidadTon || "—"} ton</div>
    </div>
  `).join("");
}

function seleccionarTractor(i) {
  document.querySelectorAll("#listaTractores .selector-item").forEach(el => el.classList.remove("seleccionado"));
  document.getElementById("tractor-" + i).classList.add("seleccionado");
  const t = tractores[i];
  viajeActual.tractor     = t.Modelo || t.modelo;
  viajeActual.capacidadTon = parseFloat(t.CapacidadTon || t.capacidadTon) || 0;
  verificarConfigCompleta();
}

function renderFrentes() {
  const ori  = document.getElementById("listaOrigen");
  const dest = document.getElementById("listaDestino");
  const html = frentes.map((f, i) => {
    const n = f.Nombre || f.nombre || "Frente " + (i+1);
    return `<div class="selector-fila" onclick="seleccionarFrente('origen', ${i}, this)">${n}</div>`;
  }).join("");
  const html2 = frentes.map((f, i) => {
    const n = f.Nombre || f.nombre || "Frente " + (i+1);
    return `<div class="selector-fila" onclick="seleccionarFrente('destino', ${i}, this)">${n}</div>`;
  }).join("");
  ori.innerHTML  = html;
  dest.innerHTML = html2;
}

function seleccionarFrente(tipo, i, el) {
  const contenedor = tipo === "origen" ? document.getElementById("listaOrigen") : document.getElementById("listaDestino");
  contenedor.querySelectorAll(".selector-fila").forEach(e => e.classList.remove("seleccionado"));
  el.classList.add("seleccionado");
  const n = frentes[i].Nombre || frentes[i].nombre;
  if (tipo === "origen") viajeActual.frenteOrigen  = n;
  else                   viajeActual.frenteDestino = n;
  verificarConfigCompleta();
}

function verificarConfigCompleta() {
  const ok = viajeActual.tractor && viajeActual.frenteOrigen && viajeActual.frenteDestino;
  document.getElementById("btnIrPulsazos").disabled = !ok;
}

// ============================================================
//  PULSAZOS
// ============================================================
function goToPulsazos() {
  document.getElementById("headerTitle").textContent    = "Viaje en curso";
  document.getElementById("headerSubtitle").textContent = viajeActual.tractor || "";
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("activa"));
  document.getElementById("screenPulsazos").classList.add("activa");

  // reset
  viajeActual.T1_Cargando   = null;
  viajeActual.T2_EnCamino   = null;
  viajeActual.T3_Descargando = null;
  viajeActual.T4_Completado  = null;

  [1,2,3,4].forEach(n => {
    const btn = document.getElementById("btn" + n);
    btn.classList.remove("completado");
    btn.classList.toggle("pendiente", n > 1);
    document.getElementById("hora" + n).textContent = n === 1 ? "Toca para registrar" : "Esperando paso anterior";
    const chk = document.getElementById(n === 4 ? "check4b" : "check" + (n === 3 ? 4 : n));
    if (chk) chk.textContent = "";
  });

  document.getElementById("cronometroBox").style.display = "none";
  if (cronInterval) clearInterval(cronInterval);

  document.getElementById("viajeResumen").innerHTML =
    `<strong>${viajeActual.tractor}</strong> &nbsp;|&nbsp; ` +
    `${viajeActual.frenteOrigen} &rarr; ${viajeActual.frenteDestino}<br>` +
    `Capacidad: <strong>${viajeActual.capacidadTon} ton</strong>`;
}

function registrarPulso(n) {
  const btn = document.getElementById("btn" + n);
  if (btn.classList.contains("pendiente") || btn.classList.contains("completado")) return;

  const ahora = new Date().toISOString();
  const hora  = new Date().toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit", second: "2-digit" });

  const claves  = [null, "T1_Cargando", "T2_EnCamino", "T3_Descargando", "T4_Completado"];
  viajeActual[claves[n]] = ahora;

  document.getElementById("hora" + n).textContent = hora;
  btn.classList.add("completado");

  const checkIds = [null, "check1", "check2", "check4", "check4b"];
  const chk = document.getElementById(checkIds[n]);
  if (chk) chk.textContent = "✓";

  // Activar siguiente
  if (n < 4) {
    const sig = document.getElementById("btn" + (n + 1));
    sig.classList.remove("pendiente");
    document.getElementById("hora" + (n + 1)).textContent = "Toca para registrar";
  }

  // Cronometro desde T1
  if (n === 1) {
    document.getElementById("cronometroBox").style.display = "block";
    cronInterval = setInterval(actualizarCronometro, 1000);
  }

  // T4 completado: ir a pantalla de carga
  if (n === 4) {
    if (cronInterval) clearInterval(cronInterval);
    setTimeout(goToCarga, 400);
  }
}

function actualizarCronometro() {
  if (!viajeActual.T1_Cargando) return;
  const seg = Math.floor((Date.now() - new Date(viajeActual.T1_Cargando).getTime()) / 1000);
  const m   = Math.floor(seg / 60).toString().padStart(2, "0");
  const s   = (seg % 60).toString().padStart(2, "0");
  document.getElementById("cronometroTiempo").textContent = m + ":" + s;
}

// ============================================================
//  NIVEL DE CARGA
// ============================================================
const NIVELES = [
  { label: "LLENO", factor: 1.00,  ancho: "100%" },
  { label: "3/4",   factor: 0.75,  ancho: "75%"  },
  { label: "1/2",   factor: 0.50,  ancho: "50%"  },
  { label: "1/4",   factor: 0.25,  ancho: "25%"  },
];

function goToCarga() {
  document.getElementById("headerTitle").textContent    = "Nivel de carga";
  document.getElementById("headerSubtitle").textContent = "";
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("activa"));
  document.getElementById("screenCarga").classList.add("activa");

  viajeActual.nivelCarga   = null;
  viajeActual.factorLlenado = null;

  const cont = document.getElementById("listaCarga");
  cont.innerHTML = NIVELES.map((nv, i) => {
    const ton = (viajeActual.capacidadTon * nv.factor).toFixed(1);
    return `
      <div class="carga-opcion" onclick="seleccionarCarga(${i})" id="carga-${i}">
        <div class="carga-label">${nv.label}</div>
        <div class="carga-barra-wrap"><div class="carga-barra" style="width:${nv.ancho}"></div></div>
        <div class="carga-ton">${ton} ton</div>
      </div>
    `;
  }).join("");

  document.getElementById("tonConfirm").textContent  = "—";
  document.getElementById("capacidadLabel").textContent = "Capacidad: " + viajeActual.capacidadTon + " ton";
  document.getElementById("btnGuardar").disabled = true;
}

function seleccionarCarga(i) {
  document.querySelectorAll(".carga-opcion").forEach(el => el.classList.remove("seleccionado"));
  document.getElementById("carga-" + i).classList.add("seleccionado");
  const nv = NIVELES[i];
  viajeActual.nivelCarga    = nv.label;
  viajeActual.factorLlenado = nv.factor;
  viajeActual.toneladasEstimadas = parseFloat((viajeActual.capacidadTon * nv.factor).toFixed(1));
  document.getElementById("tonConfirm").textContent = viajeActual.toneladasEstimadas + " ton";
  document.getElementById("btnGuardar").disabled = false;
}

// ============================================================
//  GUARDAR VIAJE
// ============================================================
async function guardarViaje() {
  if (!viajeActual.nivelCarga) return;
  document.getElementById("btnGuardar").disabled = true;
  mostrarLoading();

  if (!navigator.onLine) {
    guardarPendiente(viajeActual);
    ocultarLoading();
    mostrarToast("Guardado sin conexion. Se sincronizara.", "exito");
    setTimeout(mostrarInicio, 1200);
    return;
  }

  try {
    const res = await apiPost({ action: "guardarViaje", ...viajeActual });
    if (res.ok) {
      mostrarToast("Viaje guardado correctamente", "exito");
      setTimeout(mostrarInicio, 1000);
    } else {
      guardarPendiente(viajeActual);
      mostrarToast("Error al guardar. Guardado local.", "error");
      setTimeout(mostrarInicio, 1400);
    }
  } catch(e) {
    guardarPendiente(viajeActual);
    mostrarToast("Sin conexion. Guardado local.", "error");
    setTimeout(mostrarInicio, 1400);
  } finally {
    ocultarLoading();
  }
}

function guardarPendiente(viaje) {
  const lista = JSON.parse(localStorage.getItem(PENDING_KEY) || "[]");
  lista.push({ ...viaje, _ts: Date.now() });
  localStorage.setItem(PENDING_KEY, JSON.stringify(lista));
}

async function sincronizarPendientes() {
  const lista = JSON.parse(localStorage.getItem(PENDING_KEY) || "[]");
  if (!lista.length) return;
  const ok = [];
  for (const v of lista) {
    try {
      const res = await apiPost({ action: "guardarViaje", ...v });
      if (res.ok) ok.push(v._ts);
    } catch(e) { /* sigue */ }
  }
  if (ok.length) {
    const restantes = lista.filter(v => !ok.includes(v._ts));
    localStorage.setItem(PENDING_KEY, JSON.stringify(restantes));
    mostrarToast(ok.length + " viaje(s) sincronizado(s)", "exito");
  }
}

// ============================================================
//  LOADING / TOAST
// ============================================================
function mostrarLoading()  { document.getElementById("loadingOverlay").style.display = "flex"; }
function ocultarLoading()  { document.getElementById("loadingOverlay").style.display = "none"; }

let toastTimer = null;
function mostrarToast(msg, tipo) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className   = "toast visible" + (tipo ? " " + tipo : "");
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.classList.remove("visible"); }, 3000);
}
</script>
