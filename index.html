<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadena de Abastecimiento · Horti Organic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --green-900:#0f3d28; --green-800:#14543a; --green-700:#1b6043; --green-600:#22724f;
  --green-100:#dcebe2; --green-050:#eef5f0;
  --cream:#f3f1ea; --paper:#ffffff; --ink:#16352a; --ink-soft:#4a5d54;
  --gold:#b8821f; --gold-soft:#c98a2b; --maroon:#7a1f2b; --maroon-soft:#9e2c39;
  --line:#e3e0d5; --line-soft:#efece3;
  --mp:#2f7d4f; --me:#b8821f; --rc:#1d8f86; --af:#7a1f2b;
  --shadow:0 1px 2px rgba(20,40,30,.05),0 8px 24px rgba(20,40,30,.06);
  --serif:"Playfair Display",Georgia,"Times New Roman",serif;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:14px}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:600;color:var(--gold-soft)}
.serif{font-family:var(--serif)}
.hide{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

/* ---------- LOGIN ---------- */
#login{min-height:100vh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(120% 90% at 50% -10%,#1b6043 0%,#14543a 45%,#0f3d28 100%)}
.login-card{width:100%;max-width:420px;background:var(--paper);border-radius:18px;
  box-shadow:0 30px 60px rgba(0,0,0,.28);overflow:hidden}
.login-head{background:var(--green-800);color:#fff;padding:34px 32px 30px;text-align:center}
.login-mark{width:64px;height:64px;border-radius:50%;background:#fff;display:grid;place-items:center;
  margin:0 auto 16px;border:3px solid var(--gold)}
.login-mark span{font-family:var(--serif);font-weight:700;color:var(--green-800);font-size:24px;line-height:1}
.login-head .eyebrow{color:#a9d3b8}
.login-head h1{font-family:var(--serif);font-size:25px;font-weight:600;margin-top:6px;letter-spacing:.2px}
.login-body{padding:28px 32px 32px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;letter-spacing:.02em}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);
  border-radius:10px;background:#fcfbf7;transition:border-color .15s,box-shadow .15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--green-600);
  box-shadow:0 0 0 3px rgba(34,114,79,.12)}
.field input[type=file]{padding:8px 11px;cursor:pointer}
.field input[type=file]::file-selector-button{font-family:inherit;font-size:13px;font-weight:600;border:1.5px solid var(--line);
  background:#fff;color:var(--green-700);border-radius:8px;padding:7px 13px;margin-right:11px;cursor:pointer;transition:border-color .15s}
.field input[type=file]::file-selector-button:hover{border-color:var(--green-600)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:11px;
  font-weight:600;font-size:14px;transition:transform .08s,filter .15s,background .15s;letter-spacing:.01em}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--green-700);color:#fff}
.btn-primary:hover{filter:brightness(1.07)}
.btn-gold{background:var(--gold);color:#fff}
.btn-gold:hover{filter:brightness(1.06)}
.btn-ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn-ghost:hover{border-color:var(--green-600);color:var(--green-700)}
.btn-danger{background:#fff;color:var(--maroon);border:1.5px solid #e7ccd0}
.btn-danger:hover{background:var(--maroon);color:#fff;border-color:var(--maroon)}
.btn-block{width:100%}
.btn-sm{padding:8px 13px;font-size:13px;border-radius:9px}
.login-hint{margin-top:18px;font-size:12px;color:var(--ink-soft);background:var(--green-050);
  border:1px solid var(--green-100);border-radius:10px;padding:12px 14px;line-height:1.6}
.login-hint b{color:var(--green-700)}
.login-err{color:var(--maroon);font-size:13px;margin-top:10px;min-height:18px;font-weight:500}

/* ---------- APP SHELL ---------- */
#app{min-height:100vh;display:flex;flex-direction:column}
.topbar{background:var(--green-800);color:#fff;border-bottom:3px solid var(--gold)}
.topbar-in{max-width:1200px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:13px;min-width:0}
.brand-mark{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;border:2.5px solid var(--gold);flex:0 0 auto}
.brand-mark span{font-family:var(--serif);font-weight:700;color:var(--green-800);font-size:17px}
.brand-txt .eyebrow{color:#9ccbaf;font-size:9.5px}
.brand-txt h1{font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.05;margin-top:1px}
.topbar-spacer{flex:1}
.clock{text-align:right;font-size:12px;color:#bcdcc8;line-height:1.5}
.clock b{display:block;color:#fff;font-size:13px;font-weight:600}
.usermenu{display:flex;align-items:center;gap:10px}
.user-pill{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.1);padding:6px 8px 6px 12px;border-radius:30px}
.user-pill .nm{font-size:13px;font-weight:600;line-height:1.1}
.user-pill .rl{font-size:10.5px;color:#a9d3b8;letter-spacing:.04em;text-transform:uppercase}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--gold);display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.icon-btn{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.08);color:#fff;display:grid;place-items:center;font-size:16px}
.icon-btn:hover{background:rgba(255,255,255,.18)}

.nav{background:var(--paper);border-bottom:1px solid var(--line)}
.nav-in{max-width:1200px;margin:0 auto;padding:0 24px;display:flex;gap:4px;overflow-x:auto}
.nav-tab{padding:14px 16px 12px;font-size:14px;font-weight:600;color:var(--ink-soft);border-bottom:3px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:8px}
.nav-tab .badge{background:var(--maroon);color:#fff;font-size:11px;font-weight:700;border-radius:20px;min-width:19px;height:19px;padding:0 6px;display:grid;place-items:center}
.nav-tab:hover{color:var(--green-700)}
.nav-tab.active{color:var(--green-800);border-color:var(--gold)}

.main{flex:1;max-width:1200px;width:100%;margin:0 auto;padding:24px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head h2{font-family:var(--serif);font-size:27px;font-weight:600;line-height:1.1}
.page-head p{color:var(--ink-soft);font-size:14px;margin-top:3px}

/* ---------- HERO STAT BAND ---------- */
.hero{background:linear-gradient(115deg,var(--green-800),var(--green-700));border-radius:16px;color:#fff;
  padding:26px 30px;display:flex;align-items:center;gap:30px;margin-bottom:22px;box-shadow:var(--shadow);flex-wrap:wrap}
.hero-lead{flex:1;min-width:230px}
.hero-lead .eyebrow{color:var(--gold-soft)}
.hero-lead h3{font-family:var(--serif);font-size:25px;font-weight:600;line-height:1.12;margin-top:6px}
.hero-lead p{color:#a9d3b8;font-size:13px;margin-top:7px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{text-align:center;min-width:74px}
.hstat .v{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1}
.hstat .v.gold{color:var(--gold-soft)}
.hstat .l{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#9ccbaf;margin-top:7px}

/* ---------- KPI cards ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.kpi .l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}
.kpi .v{font-family:var(--serif);font-size:30px;font-weight:600;margin-top:6px;line-height:1}
.kpi .v.green{color:var(--green-700)} .kpi .v.gold{color:var(--gold)} .kpi .v.maroon{color:var(--maroon)}

/* ---------- toolbar ---------- */
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;padding:11px 14px 11px 40px;border:1.5px solid var(--line);border-radius:30px;background:var(--paper)}
.search input:focus{outline:none;border-color:var(--green-600);box-shadow:0 0 0 3px rgba(34,114,79,.1)}
.search .ic{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#9aa89f}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:8px 13px;border-radius:30px;font-size:13px;font-weight:600;color:var(--ink-soft);background:var(--paper);border:1.5px solid var(--line)}
.chip:hover{border-color:var(--green-600)}
.chip.on{background:var(--green-700);color:#fff;border-color:var(--green-700)}

/* ---------- ITEM CARDS ---------- */
.cards{display:grid;gap:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:0;overflow:hidden;box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(20,40,30,.10)}
.card.turn{border-color:var(--gold);box-shadow:0 0 0 2px rgba(184,130,31,.18),var(--shadow)}
.card-body{padding:18px 20px}
.card-top{display:flex;align-items:flex-start;gap:14px}
.card-id{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--maroon);background:#fbeef0;border:1px solid #f0d6da;padding:5px 11px;border-radius:9px;white-space:nowrap}
.card-main{flex:1;min-width:0}
.card-title{font-size:16px;font-weight:600;line-height:1.25}
.card-sub{color:var(--ink-soft);font-size:13px;margin-top:3px}
.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:7px;letter-spacing:.02em}
.tag-cat{color:#fff}
.tag-tipo{background:var(--green-050);color:var(--green-700);border:1px solid var(--green-100)}
.tag-tipo.sol{background:#fbf2e0;color:var(--gold);border-color:#f0e1c0}
.tag-state{background:#eef0f1;color:#566;border:1px solid #e1e5e6}
.tag-state.warn{background:#fbf2e0;color:var(--gold);border-color:#f0e1c0}
.tag-state.bad{background:#fbeef0;color:var(--maroon);border-color:#f0d6da}
.tag-state.ok{background:var(--green-050);color:var(--green-700);border-color:var(--green-100)}

/* progress rail */
.rail{display:flex;align-items:center;margin-top:16px}
.rail-step{display:flex;flex-direction:column;align-items:center;flex:0 0 auto;width:64px}
.rail-dot{width:24px;height:24px;border-radius:50%;background:#eef0ec;color:#9aa89f;display:grid;place-items:center;font-size:12px;font-weight:700;border:2px solid #e3e6e0;z-index:1}
.rail-dot.done{background:var(--green-700);color:#fff;border-color:var(--green-700)}
.rail-dot.now{background:var(--gold);color:#fff;border-color:var(--gold);box-shadow:0 0 0 4px rgba(184,130,31,.16)}
.rail-lbl{font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft);margin-top:6px;text-align:center;font-weight:600}
.rail-line{flex:1;height:3px;background:#e3e6e0;margin:0 -6px;margin-top:-22px;border-radius:2px}
.rail-line.done{background:var(--green-700)}

.card-actions{display:flex;gap:8px;flex-wrap:wrap;padding:14px 20px;background:#fbfaf6;border-top:1px solid var(--line-soft)}
.card-actions .spacer{flex:1}
.value-num{font-family:var(--serif);font-size:18px;font-weight:600;color:var(--green-800)}

.empty{text-align:center;padding:60px 24px;color:var(--ink-soft)}
.empty .ic{font-size:40px;opacity:.5}
.empty h3{font-family:var(--serif);font-size:21px;color:var(--ink);margin:14px 0 4px;font-weight:600}

/* ---------- MODAL ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,40,28,.5);display:flex;align-items:flex-start;justify-content:center;
  padding:40px 18px;z-index:50;overflow-y:auto;animation:fade .15s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--paper);border-radius:18px;width:100%;max-width:560px;box-shadow:0 30px 70px rgba(0,0,0,.35);
  animation:pop .18s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:translateY(12px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.modal-head{padding:22px 26px 16px;border-bottom:1px solid var(--line)}
.modal-head h3{font-family:var(--serif);font-size:22px;font-weight:600}
.modal-head p{color:var(--ink-soft);font-size:13px;margin-top:3px}
.modal-body{padding:22px 26px;max-height:62vh;overflow-y:auto}
.modal-foot{padding:16px 26px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;background:#fbfaf6;border-radius:0 0 18px 18px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.modal-close{float:right;color:var(--ink-soft);font-size:22px;line-height:1;margin-top:-2px}

/* quote list */
.quote{border:1.5px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;position:relative;transition:border-color .15s,background .15s}
.quote.sug{border-color:var(--gold);background:#fffdf6}
.quote-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.quote-prov{font-weight:600}
.quote-price{font-family:var(--serif);font-size:18px;font-weight:600;color:var(--green-800)}
.quote-meta{font-size:12.5px;color:var(--ink-soft);margin-top:5px;display:flex;gap:14px;flex-wrap:wrap}
.sug-badge{position:absolute;top:-9px;left:12px;background:var(--gold);color:#fff;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:20px}
.pick-radio{accent-color:var(--green-700);width:17px;height:17px}

/* signature */
.sigpad{border:2px dashed var(--green-100);border-radius:12px;background:#fcfdfb;touch-action:none;display:block;width:100%}
.sig-tools{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12.5px;color:var(--ink-soft)}

/* table (inventario) */
.tbl-wrap{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);
  padding:13px 16px;background:#fbfaf6;border-bottom:1px solid var(--line);font-weight:600}
td{padding:13px 16px;border-bottom:1px solid var(--line-soft);font-size:14px;vertical-align:middle}
tr:last-child td{border-bottom:none}
.stock{font-family:var(--serif);font-size:17px;font-weight:600}
.stock.low{color:var(--maroon)}
.stock-bar{height:6px;border-radius:4px;background:#eef0ec;margin-top:5px;overflow:hidden;width:120px}
.stock-bar i{display:block;height:100%;background:var(--green-600)}
.stock-bar i.low{background:var(--maroon-soft)}

/* toast */
#toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:10px;align-items:center}
.toast{background:var(--green-800);color:#fff;padding:13px 20px;border-radius:30px;font-size:14px;font-weight:500;
  box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;align-items:center;gap:10px;animation:slideup .25s ease}
.toast.gold{background:var(--gold)} .toast.bad{background:var(--maroon)}
.toast .tk{font-size:17px}
@keyframes slideup{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}

.note{font-size:12.5px;color:var(--ink-soft);background:var(--green-050);border:1px solid var(--green-100);
  border-radius:10px;padding:11px 14px;line-height:1.55;margin-bottom:16px}
.note b{color:var(--green-700)}
.help{font-size:12px;color:var(--ink-soft);margin-top:5px}

@media(max-width:680px){
  .topbar-in{flex-wrap:wrap}.clock{display:none}.row2{grid-template-columns:1fr}
  .rail-step{width:52px}.rail-lbl{font-size:8.5px}
  .page-head h2{font-size:22px}
}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<section id="login">
  <div class="login-card">
    <div class="login-head">
      <div class="login-mark"><span>H</span></div>
      <div class="eyebrow">Horti Organic · S.A.S</div>
      <h1>Cadena de Abastecimiento</h1>
    </div>
    <div class="login-body">
      <div class="field">
        <label for="lg-user">Usuario</label>
        <input id="lg-user" autocomplete="username" placeholder="Tu usuario">
      </div>
      <div class="field">
        <label for="lg-pass">Contraseña</label>
        <input id="lg-pass" type="password" autocomplete="current-password" placeholder="••••••">
      </div>
      <button class="btn btn-primary btn-block" id="lg-btn">Ingresar</button>
      <div class="login-err" id="lg-err"></div>
      <div class="login-hint">
        <b>Cuentas de demostración</b><br>
        lider · gerente · conta · almacen · admin<br>
        contraseña para todas: <b>123</b>
      </div>
    </div>
  </div>
</section>

<!-- ============ APP ============ -->
<div id="app" class="hide">
  <header class="topbar">
    <div class="topbar-in">
      <div class="brand">
        <div class="brand-mark"><span>H</span></div>
        <div class="brand-txt">
          <div class="eyebrow">Horti Organic — Abastecimiento</div>
          <h1>Cadena de Compras</h1>
        </div>
      </div>
      <div class="topbar-spacer"></div>
      <div class="clock"><b id="clock-time">—</b><span id="clock-date">—</span></div>
      <div class="usermenu">
        <div class="user-pill">
          <div>
            <div class="nm" id="u-name">—</div>
            <div class="rl" id="u-role">—</div>
          </div>
          <div class="avatar" id="u-avatar">·</div>
        </div>
        <button class="icon-btn" id="logout" title="Cerrar sesión">⎋</button>
      </div>
    </div>
  </header>
  <nav class="nav"><div class="nav-in" id="nav"></div></nav>
  <main class="main" id="view"></main>
</div>

<div id="toasts"></div>

<script>
/* =======================================================================
   CAPA DE DATOS  ·  prototipo en memoria
   -----------------------------------------------------------------------
   Para producción: reemplazar los métodos de `API` por fetch() al
   Web App de Google Apps Script. Ejemplo:
     const BACKEND='https://script.google.com/macros/s/XXX/exec';
     listItems: async ()=> (await fetch(BACKEND+'?action=items')).json()
   La firma de cada método se mantiene igual, así el resto del front no cambia.
   ======================================================================= */

/* ╔════════════════════════════════════════════════════════════════════╗
   ║  CONEXIÓN AL BACKEND                                                 ║
   ║  Pega aquí la URL del Web App de Apps Script (termina en /exec).     ║
   ║  Si la dejas VACÍA, el sistema corre en modo demo con datos locales  ║
   ║  (no guarda nada). Es lo único que necesitas cambiar para conectar.  ║
   ╚════════════════════════════════════════════════════════════════════╝ */
const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbxONa24Up3cfsc1Gcnn6kuIEiEpIRJoNlT7u5M8BCkWbS9f-kLZ0E_QXBDfQtXPygGs7Q/exec';   // ej: 'https://script.google.com/macros/s/AKfy.../exec'
const MODO = BACKEND_URL ? 'remoto' : 'demo';

async function remote(action, payload){
  const r = await fetch(BACKEND_URL, { method:'POST', body: JSON.stringify(Object.assign({action}, payload||{})) });
  return r.json();
}
function applyState(d){
  if(!d) return;
  if(d.items) DB.items = d.items;
  if(d.receptores) DB.receptores = d.receptores;
  if(d.inventario) DB.inventario = d.inventario;
  if(d.movimientos) DB.movimientos = d.movimientos;
}
async function loadAll(){
  if(MODO==='demo') return;            // en demo, seed() ya llenó DB
  applyState(await remote('bootstrap', {}));
}

const CAT = {
  MP:{label:'Materia prima', color:'var(--mp)'},
  ME:{label:'Material de empaque', color:'var(--me)'},
  RC:{label:'Consumibles', color:'var(--rc)'},
  AF:{label:'Activos fijos', color:'var(--af)'}
};
const ROLES = {

function pendingFor(tab){
  const it=API.items();
  if(tab==='gerente') return it.filter(x=>x.estado==='en_aprobacion').length;
  if(tab==='conta')   return it.filter(x=>x.estado==='aprobada').length;
  if(tab==='almacen') return it.filter(x=>x.estado==='en_inventario').length;
  if(tab==='lider')   return it.filter(x=>x.estado==='pospuesta'||x.estado==='cotizando').length;
  return 0;
}
function renderNav(){
  $('#nav').innerHTML=NAV[session.rol].map(([id,lbl])=>{
    const n=pendingFor(id);
    return `<button class="nav-tab ${id===activeTab?'active':''}" data-tab="${id}">${esc(lbl)}${n?`<span class="badge">${n}</span>`:''}</button>`;
  }).join('');
  $$('#nav .nav-tab').forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;filterCat='';search='';renderNav();render();});
}

/* ---------- ROUTER ---------- */
function render(){
  const v=$('#view'); v.style.opacity='0';
  setTimeout(()=>{
    if(activeTab==='dash') v.innerHTML=viewDash();
    else if(activeTab==='lider') v.innerHTML=viewQueue('lider');
    else if(activeTab==='gerente') v.innerHTML=viewQueue('gerente');
    else if(activeTab==='conta') v.innerHTML=viewQueue('conta');
    else if(activeTab==='almacen') v.innerHTML=viewQueue('almacen');
    else if(activeTab==='inventario') v.innerHTML=viewInventario();
    bindView();
    v.style.transition='opacity .18s'; v.style.opacity='1';
  },60);
}

/* ---------- HELPERS UI ---------- */
function catTag(c){ return `<span class="tag tag-cat" style="background:${CAT[c].color}">${c} · ${esc(CAT[c].label)}</span>`; }
function tipoTag(t){ return `<span class="tag tag-tipo ${t==='solicitud'?'sol':''}">${t==='necesidad'?'Necesidad':'Solicitud'}</span>`; }
function stateTag(it){
  const m={cotizando:['En cotización',''],en_aprobacion:['Esperando aprobación','warn'],
    aprobada:['Aprobada · pago','ok'],pospuesta:['Pospuesta','warn'],rechazada:['Rechazada','bad'],
    en_inventario:['En inventario','ok'],entregada:['Entregada','ok']};
  const [l,k]=m[it.estado]||[it.estado,'']; return `<span class="tag tag-state ${k}">${l}</span>`;
}
function selectedQuote(it){ return it.cotizaciones.find(q=>q.seleccionada) || it.cotizaciones.find(q=>q.sugerida) || it.cotizaciones[0]; }
function itemValue(it){ const q=selectedQuote(it); return q? q.precioUnit*it.cantidad : 0; }

function rail(it){
  const cur=STAGE[it.estado]??0;
  const off = (it.estado==='rechazada'||it.estado==='pospuesta');
  let h='<div class="rail">';
  RAIL.forEach((s,i)=>{
    if(i>0) h+=`<div class="rail-line ${i<=cur&&!off?'done':''}"></div>`;
    const cls = off&&i>=cur ? '' : i<cur?'done': i===cur?'now':'';
    h+=`<div class="rail-step"><div class="rail-dot ${cls}">${i<cur?'✓':i+1}</div><div class="rail-lbl">${s}</div></div>`;
  });
  return h+'</div>';
}

function card(it,actionsHtml){
  const turn = needsRole(it,session.rol);
  return `<div class="card ${turn?'turn':''}" data-id="${it.id}">
    <div class="card-body">
      <div class="card-top">
        <div class="card-id">${it.id}</div>
        <div class="card-main">
          <div class="card-title">${esc(it.descripcion)}</div>
          <div class="card-sub">${it.cantidad.toLocaleString('es-CO')} ${esc(it.unidad)} · creado por ${esc(it.creadoPor)}</div>
          <div class="tags">${tipoTag(it.tipo)}${catTag(it.categoria)}${stateTag(it)}
            ${itemValue(it)?`<span class="tag tag-state">${cop(itemValue(it))}</span>`:''}</div>
        </div>
      </div>
      ${rail(it)}
    </div>
    ${actionsHtml?`<div class="card-actions">${actionsHtml}</div>`:''}
  </div>`;
}

function needsRole(it,rol){
  if(rol==='lider') return it.estado==='cotizando'||it.estado==='pospuesta';
  if(rol==='gerente') return it.estado==='en_aprobacion';
  if(rol==='conta') return it.estado==='aprobada';
  if(rol==='almacen') return it.estado==='en_inventario';
  return false;
}

function queueConfig(role){
  if(role==='lider') return {
    title:'Mis compras', sub:'Crea necesidades o solicitudes, cotiza con proveedores y envíalas a aprobación.',
    filter:it=>['cotizando','pospuesta','en_aprobacion'].includes(it.estado)||it.creadoPor===session.usuario,
    cta:`<button class="btn btn-gold" id="new-item">+ Nueva compra</button>`};
  if(role==='gerente') return {
    title:'Aprobaciones', sub:'Revisa las opciones cotizadas y decide: aprobar, rechazar o posponer.',
    filter:it=>it.estado==='en_aprobacion'};
  if(role==='conta') return {
    title:'Pagos', sub:'Gestiona la asignación de compra, registra el pago y adjunta la factura.',
    filter:it=>it.estado==='aprobada', cta:`<button class="btn btn-ghost" id="export">Descargar Excel</button>`};
  if(role==='almacen') return {
    title:'Recepción y entrega', sub:'Recibe lo que ingresó a inventario y registra la entrega con firma.',
    filter:it=>it.estado==='en_inventario'};
}
function viewQueue(role){
  const cfg=queueConfig(role);
  let items=API.items().filter(cfg.filter);
  if(filterCat) items=items.filter(i=>i.categoria===filterCat);
  if(search){ const s=search.toLowerCase(); items=items.filter(i=>i.descripcion.toLowerCase().includes(s)||i.id.toLowerCase().includes(s)); }
  items.sort((a,b)=> (needsRole(b,role)-needsRole(a,role)) || b.fecha.localeCompare(a.fecha));

  const cats=Object.keys(CAT).map(c=>`<button class="chip ${filterCat===c?'on':''}" data-cat="${c}">${c}</button>`).join('');
  const list = items.length? `<div class="cards">${items.map(it=>card(it,queueActions(role,it))).join('')}</div>`
    : `<div class="empty"><div class="ic">🌱</div><h3>Nada pendiente por aquí</h3><p>Cuando llegue algo para ${esc(ROLES[role===session.rol?session.rol:role]).toLowerCase()} aparecerá en esta bandeja.</p></div>`;

  return `<div class="page-head"><div><div class="eyebrow">${esc(ROLES[session.rol])}</div>
      <h2>${cfg.title}</h2><p>${cfg.sub}</p></div>${cfg.cta||''}</div>
    <div class="toolbar">
      <div class="search"><span class="ic">⌕</span><input id="search" placeholder="Buscar por nombre o código…" value="${esc(search)}"></div>
      <div class="chips"><button class="chip ${!filterCat?'on':''}" data-cat="">Todas</button>${cats}</div>
    </div>${list}`;
}

function queueActions(role,it){
  if(role==='lider'){
    if(it.estado==='cotizando') return `<button class="btn btn-ghost btn-sm act" data-a="quote" data-id="${it.id}">Cotizar / opciones</button>
      <div class="spacer"></div>
      <button class="btn btn-primary btn-sm act" data-a="send" data-id="${it.id}" ${it.cotizaciones.length?'':'disabled style="opacity:.5"'}>Enviar a aprobación →</button>`;
    if(it.estado==='pospuesta') return `<span class="help">Pospuesta por el gerente · ${esc(it.decision?.comentario||'')}</span><div class="spacer"></div>
      <button class="btn btn-gold btn-sm act" data-a="reactivate" data-id="${it.id}">Reactivar</button>`;
    return `<button class="btn btn-ghost btn-sm act" data-a="detail" data-id="${it.id}">Ver detalle</button>`;
  }
  if(role==='gerente') return `<button class="btn btn-ghost btn-sm act" data-a="review" data-id="${it.id}">Ver opciones</button>
    <div class="spacer"></div>
    <button class="btn btn-danger btn-sm act" data-a="reject" data-id="${it.id}">Rechazar</button>
    <button class="btn btn-ghost btn-sm act" data-a="postpone" data-id="${it.id}">Posponer</button>
    <button class="btn btn-primary btn-sm act" data-a="approve" data-id="${it.id}">Aprobar</button>`;
  if(role==='conta') return `<span class="value-num">${cop(itemValue(it))}</span><span class="help"> + IVA</span>
    <div class="spacer"></div>
    <button class="btn btn-gold btn-sm act" data-a="pay" data-id="${it.id}">Registrar pago →</button>`;
  if(role==='almacen') return `<button class="btn btn-ghost btn-sm act" data-a="detail" data-id="${it.id}">Detalle</button>
    <div class="spacer"></div>
    <button class="btn btn-primary btn-sm act" data-a="deliver" data-id="${it.id}">Recibir y firmar →</button>`;
  return '';
}

/* =======================================================================
   BIND + ACCIONES
   ======================================================================= */
function bindView(){
  const s=$('#search'); if(s) s.oninput=e=>{search=e.target.value; clearTimeout(window._st);
    window._st=setTimeout(()=>{ render(); setTimeout(()=>{const n=$('#search');if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length);}},90);
    },220);};
  $$('[data-cat]').forEach(b=>b.onclick=()=>{filterCat=b.dataset.cat;render();});
  const ni=$('#new-item'); if(ni) ni.onclick=openNew;
  const ex=$('#export'); if(ex) ex.onclick=openExport;
  $$('.act').forEach(b=>b.onclick=()=>handleAction(b.dataset.a,b.dataset.id));
}

function findItem(id){ return API.items().find(x=>x.id===id); }
function findInv(id){ return API.inventario().find(x=>x.id===id); }

async function handleAction(a,id){
  const it=findItem(id);
  switch(a){
    case 'quote': openQuote(it); break;
    case 'send': it.estado='en_aprobacion'; await API.saveItem(it); log('enviar_aprobacion','item',it.id);
      toast('Enviado a aprobación del gerente'); refresh(); break;
    case 'reactivate': it.estado='cotizando'; it.decision=null; await API.saveItem(it); log('reactivar','item',it.id);
      toast('Compra reactivada','gold'); refresh(); break;
    case 'review': openReview(it); break;
    case 'approve': openReview(it); break;
    case 'reject': openReject(it); break;
    case 'postpone': openPostpone(it); break;
    case 'pay': openPay(it); break;
    case 'deliver': openDeliver(it); break;
    case 'detail': openDetail(it); break;
    case 'invout': openInvOut(findInv(id)); break;
  }
}
function refresh(){ renderNav(); render(); }

/* ---------- MODAL ENGINE ---------- */
function modal(html){
  closeModal();
  const o=document.createElement('div'); o.className='overlay'; o.id='ov';
  o.innerHTML=`<div class="modal">${html}</div>`;
  o.addEventListener('click',e=>{if(e.target===o)closeModal();});
  document.body.appendChild(o);
  $$('#ov [data-close]').forEach(b=>b.onclick=closeModal);
  return o;
}
function closeModal(){ const o=$('#ov'); if(o)o.remove(); }
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

/* ---------- PAGO (contabilidad) ---------- */
function openPay(it){
  const base=itemValue(it);
  modal(`<div class="modal-head"><button class="modal-close" data-close>×</button>
      <h3>Asignación de pago · ${it.id}</h3><p>${esc(it.descripcion)} · ${esc(selectedQuote(it)?.proveedor||'')}</p></div>
    <div class="modal-body">
      <div class="row2">
        <div class="field"><label>Base (COP)</label><input id="p-base" type="number" value="${base}"></div>
        <div class="field"><label>IVA (%)</label><input id="p-iva" type="number" value="19"></div></div>
      <div class="note" id="p-calc"></div>
      <div class="row2">
        <div class="field"><label>Método de pago</label><select id="p-met">
          <option>Transferencia</option><option>Efectivo</option><option>Cheque</option><option>Tarjeta</option></select></div>
        <div class="field"><label>Monto pagado (COP)</label><input id="p-pag" type="number" value="0"></div></div>
      <div class="field"><label>Vencimiento (si queda saldo)</label><input id="p-venc" type="date"></div>
      <div class="field"><label>Factura</label>
        <input id="p-file" type="file" accept="image/*,application/pdf">
        <div class="help" id="p-file-status">Toma o elige una foto de la factura. Se sube a Drive automáticamente.</div></div>
      <div class="field"><input id="p-fac" placeholder="o pega un enlace de Drive (opcional)"></div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" data-close>Cancelar</button>
      <button class="btn btn-gold" id="p-do">Guardar y enviar a inventario →</button></div>`);
  const calc=()=>{
    const b=+$('#p-base').value||0, ip=+$('#p-iva').value||0, iva=Math.round(b*ip/100), total=b+iva;
    const pag=Math.min(+$('#p-pag').value||0,total), saldo=total-pag;
    const estado= pag>=total&&total>0?'pagado': pag>0?'crédito (parcial)':'pendiente';
    $('#p-calc').innerHTML=`IVA: <b>${cop(iva)}</b> · Total: <b>${cop(total)}</b> · Saldo: <b>${cop(saldo)}</b> · Estado: <b style="color:var(--green-700)">${estado}</b>`;
    return {b,ip,iva,total,pag,saldo,estado};
  };
  ['#p-base','#p-iva','#p-pag'].forEach(s=>$(s).oninput=calc); calc();
  $('#p-do').onclick=async ()=>{
    const c=calc();
    const fileInput=$('#p-file'), link=$('#p-fac').value.trim();
    const file=fileInput.files&&fileInput.files[0];
    if(!file && !link && !confirm('No adjuntaste factura. ¿Continuar de todas formas?')) return;
    let facturaUrl=link;
    if(file){
      $('#p-do').disabled=true; $('#p-file-status').textContent='Subiendo factura…';
      try{
        const dataUrl=await fileToDataURL(file);
        if(MODO==='remoto'){ const r=await remote('uploadFactura',{dataUrl,nombre:'factura_'+it.id});
          if(!r||!r.url) throw new Error('sin url'); facturaUrl=r.url; }
        else { facturaUrl=dataUrl; }   // demo: la imagen queda en memoria
      }catch(e){ toast('No se pudo subir la factura','bad'); $('#p-do').disabled=false; $('#p-file-status').textContent='Intenta de nuevo.'; return; }
    }
    it.pago={estado:c.estado,metodo:$('#p-met').value,base:c.b,ivaPct:c.ip,iva:c.iva,total:c.total,
      pagado:c.pag,saldo:c.saldo,vencimiento:$('#p-venc').value,factura:facturaUrl,
      historial:[{fecha:now(),monto:c.pag}]};
    await API.pushInventory(it); log('registrar_pago','item',it.id);
    toast('Pago registrado · enviado a inventario','gold'); closeModal(); refresh();
  };
}

          <button class="btn btn-ghost btn-sm" id="sig-clear" type="button">Limpiar</button></div></div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" data-close>Cancelar</button>
      <button class="btn btn-primary" id="d-do">Confirmar entrega</button></div>`);
  const cv=$('#sig'), ctx=cv.getContext('2d');
  const fit=()=>{cv.width=cv.offsetWidth; ctx.strokeStyle='#16352a'; ctx.lineWidth=2.2; ctx.lineCap='round';ctx.lineJoin='round';};
  setTimeout(fit,30);
  let drawing=false,empty=true;
  const pos=e=>{const r=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top};};
  const start=e=>{drawing=true;empty=false;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);e.preventDefault();};
  const move=e=>{if(!drawing)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault();};
  const end=()=>drawing=false;
  cv.addEventListener('mousedown',start);cv.addEventListener('mousemove',move);window.addEventListener('mouseup',end);
  cv.addEventListener('touchstart',start);cv.addEventListener('touchmove',move);cv.addEventListener('touchend',end);
  $('#sig-clear').onclick=()=>{ctx.clearRect(0,0,cv.width,cv.height);empty=true;};
  $('#d-do').onclick=async ()=>{
    if(empty){toast('Falta la firma del receptor','bad');return;}
    const [nombre,cargo]=$('#d-rec').value.split('|');
    await API.deliver(it,nombre,cargo,cv.toDataURL());
    toast('Entrega registrada con firma ✓'); closeModal(); refresh();
  };
}

/* ---------- SALIDA DE INVENTARIO (almacén) ---------- */
function openInvOut(inv){
  modal(`<div class="modal-head"><button class="modal-close" data-close>×</button>
      <h3>Registrar salida</h3><p>${esc(inv.item)} · stock actual ${inv.stock.toLocaleString('es-CO')} ${esc(inv.unidad)}</p></div>
    <div class="modal-body"><div class="field"><label>Cantidad que sale</label>
      <input id="o-cant" type="number" min="1" max="${inv.stock}" value="1"></div>
      <div class="field"><label>Motivo</label><input id="o-mot" placeholder="Uso en producción, entrega…"></div></div>
    <div class="modal-foot"><button class="btn btn-ghost" data-close>Cancelar</button>
      <button class="btn btn-primary" id="o-do">Descontar del stock</button></div>`);
  $('#o-do').onclick=async ()=>{ const c=+$('#o-cant').value||0; if(c<=0){toast('Cantidad inválida','bad');return;}
    await API.invMove(inv,'salida',c,$('#o-mot').value.trim()); toast('Salida registrada'); closeModal(); render(); };
}

/* ---------- DETALLE ---------- */
function openDetail(it){
  const q=selectedQuote(it);
  modal(`<div class="modal-head"><button class="modal-close" data-close>×</button>
      <h3>${it.id}</h3><p>${esc(it.descripcion)}</p></div>
    <div class="modal-body">
      <div class="tags" style="margin-bottom:14px">${tipoTag(it.tipo)}${catTag(it.categoria)}${stateTag(it)}</div>
      ${it.planeacion?`<div class="note"><b>Planeación:</b> ${esc(it.planeacion)}</div>`:''}
      ${it.comentarioLider?`<div class="note"><b>Líder:</b> ${esc(it.comentarioLider)}</div>`:''}
      ${q?`<div class="note"><b>Proveedor:</b> ${esc(q.proveedor)} · ${cop(q.precioUnit*it.cantidad)}</div>`:''}
      ${it.decision?`<div class="note"><b>Decisión:</b> ${it.decision.resultado} ${it.decision.comentario?'· '+esc(it.decision.comentario):''}</div>`:''}
      ${it.pago?`<div class="note"><b>Pago:</b> ${it.pago.estado} · ${cop(it.pago.total)} · ${esc(it.pago.metodo)}</div>`:''}
      ${it.pago&&it.pago.factura?`<div class="note"><b>Factura:</b> ${facturaHtml(it.pago.factura)}</div>`:''}
      ${it.entrega?`<div class="note"><b>Entregado a:</b> ${esc(it.entrega.receptor)} (${esc(it.entrega.cargo)})<br>
        <img src="${it.entrega.firma}" style="max-width:200px;border:1px solid var(--line);border-radius:8px;margin-top:8px"></div>`:''}
    </div>
    <div class="modal-foot"><button class="btn btn-primary" data-close>Cerrar</button></div>`);
}
